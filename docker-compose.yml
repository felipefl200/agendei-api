services:
  mysql:
    image: mysql:8.4
    container_name: agendei-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agendei
      MYSQL_USER: agendei
      MYSQL_PASSWORD: agendei
    ports:
      - '3306:3306'
    volumes:
      - agendei_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agendei_mysql_data:
